name: Publish Northflank image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: northflank-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET_KEY: ci-only-jwt-secret-with-more-than-thirty-two-characters
      SECRET_KEY: ci-only-app-secret-with-more-than-thirty-two-characters
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Run test suite
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"
          pytest -q

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/sharonrose28/ticket-classifier-api:latest
            ghcr.io/sharonrose28/ticket-classifier-api:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/sharonrose28/ticket-classifier
          cache-from: type=gha,scope=northflank-api
          cache-to: type=gha,mode=max,scope=northflank-api
