name: ticket-classifier

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: ${API_IMAGE:-ticket-classifier-api:local}
  env_file:
    - ${ENV_FILE:-.env}
  environment: &app-environment
    APP_ENV: production
    DEBUG: "false"
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ticket_classifier}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-ticket_classifier}
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    CELERY_RESULT_BACKEND: redis://redis:6379/2
    AUTH_COOKIE_SECURE: "true"
  networks: [backend]
  restart: unless-stopped
  init: true
  security_opt: [no-new-privileges:true]

services:
  proxy:
    build:
      context: frontend
      dockerfile: Dockerfile
    image: ${FRONTEND_IMAGE:-ticket-classifier-frontend:local}
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    networks: [backend]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    stop_grace_period: 15s

  edge:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    profiles: ["tls"]
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./docker/nginx/https.conf.example:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      proxy:
        condition: service_healthy
    networks: [backend]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "/dev/null", "https://127.0.0.1:8443/api/live"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ticket_classifier}
      POSTGRES_USER: ${POSTGRES_USER:-ticket_classifier}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    stop_grace_period: 20s

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true

  api:
    <<: *app
    expose: ["8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s

  celery-worker:
    <<: *app
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=${LOG_LEVEL:-INFO}", "--concurrency=${CELERY_WORKER_CONCURRENCY:-4}", "--queues=classification.default,classification.dead_letter"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app:celery_app inspect ping -d celery@$${HOSTNAME} --timeout=5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_grace_period: 60s

  celery-beat:
    <<: *app
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "beat", "--loglevel=${LOG_LEVEL:-INFO}", "--schedule=/tmp/celerybeat-schedule", "--pidfile=/tmp/celerybeat.pid"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib; assert b'beat' in pathlib.Path('/proc/1/cmdline').read_bytes()"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 30s

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
