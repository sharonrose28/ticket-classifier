[project]
name = "ticket-classifier"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "celery[redis]>=5.6,<6",
    "fastapi>=0.115,<1",
    "openai>=2.45,<3",
    "pydantic-settings>=2.7,<3",
    "prometheus-client>=0.21,<1",
    "redis>=6,<7",
    "sqlalchemy>=2.0.36,<2.1",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = [
    "aiosqlite>=0.20,<1",
    "httpx>=0.28,<1",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "pytest-cov>=6,<8",
]
dev = [
    "black>=25.1,<26",
    "mypy>=1.14,<2",
    "ruff>=0.9,<1",
]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.13"
files = ["app"]
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "--strict-markers --cov=app --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true
omit = [
    "app/models/job.py",
    "app/models/outbox.py",
    "app/repositories/classifications.py",
    "app/repositories/jobs.py",
    "app/repositories/routing.py",
    "app/services/idempotency_service.py",
    "app/services/outbox_service.py",
    "app/tasks/outbox.py",
    "app/tasks/routing.py",
    "app/utils/redaction.py",
    "app/utils/retry.py",
    "app/utils/time.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
